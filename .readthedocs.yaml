version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  commands:
    - python -m pip install -r source/requirements.txt
    - mkdir -p build
    - doxygen Doxyfile
    - python -m sphinx -b html source $READTHEDOCS_OUTPUT/html
    - make html

sphinx:
  builder: html
  configuration: source/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: source/requirements.txt